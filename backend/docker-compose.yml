version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=http://localhost:8080
      - DB_CONNECTION=pgsql
      - DB_HOST=postgresql
      - DB_PORT=5432
      - DB_DATABASE=servermc
      - DB_USERNAME=postgres
      - DB_PASSWORD=1232
      - SANCTUM_STATEFUL_DOMAINS=${FRONTEND_URL:-http://localhost:3000}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - SESSION_DRIVER=database
      - FILESYSTEM_DISK=public
    volumes:
      - backend-storage:/var/www/storage/app
    depends_on:
      postgresql:
        condition: service_healthy

  postgresql:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: servermc
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1232
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  backend-storage:
